apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-banners
  namespace: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-banners
  template:
    metadata:
      labels:
        app: api-banners
    spec:
      containers:
        - name: api-banners
          image: evertonzauso777/api-banners-arm64:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-banners-config
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"